<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="320"
  viewBox="0 0 1200 320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    Gheorghe Pleșca — infrastructure and product architecture
  </title>
  <desc id="description">
    A dark terminal-inspired banner with green accents and a diagram connecting
