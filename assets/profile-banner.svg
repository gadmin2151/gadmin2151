    font-size="48"
    font-weight="700"
    letter-spacing="-1.5"
  >
    Gheorghe Pleșca
    <tspan fill="#39c66d">.</tspan>
  </text>
  <text
    x="46"
    y="166"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    fill="#b4c7bb"
    font-size="20"
