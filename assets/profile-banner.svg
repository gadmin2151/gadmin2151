  </g>
  <g fill="#10251a" stroke="#367650" stroke-width="1.5">
    <rect x="854" y="94" width="254" height="46" rx="9" />
    <rect x="854" y="174" width="254" height="46" rx="9" />
    <rect x="854" y="254" width="254" height="38" rx="9" />
    <path d="M981 140V174M981 220V254" />
  </g>
  <g
    font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
