    <text x="981" y="122" fill="#d4e5db">01 / INFRASTRUCTURE</text>
    <text x="981" y="202" fill="#d4e5db">02 / DELIVERY</text>
    <text x="981" y="278" fill="#39c66d">03 / PRODUCTS</text>
