  </desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#193126" stroke-width="1" />
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#10251a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#fade)" />
  <rect
    x="710"
    width="490"
    height="320"
    rx="20"
    fill="url(#grid)"
    opacity="0.65"
  />
  <rect
    x="1"
    y="1"
    width="1198"
    height="318"
    rx="19"
    fill="none"
    stroke="#284034"
  />
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <circle cx="44" cy="36" r="4" fill="#39c66d" />
    <text x="60" y="41" fill="#a7c8b3" font-size="13" letter-spacing="2">
      GADMIN2151 / BUILD LOG
    </text>
    <text x="1154" y="41" fill="#648b75" font-size="13" text-anchor="end">
      ~/projects
    </text>
  </g>
  <path d="M32 60H1168" stroke="#284034" />
  <text
    x="44"
    y="126"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
