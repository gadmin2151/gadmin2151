    Infrastructure. Self-hosted software. Product architecture.
  </text>
  <g
    font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
    font-size="14"
  >
    <text x="46" y="225" fill="#39c66d">$</text>
    <text x="66" y="225" fill="#d4e5db">
